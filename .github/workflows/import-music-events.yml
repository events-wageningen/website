name: Import Music Events from UIT in Wageningen

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/import-uiw.js'
      - '.github/workflows/import-music-events.yml'

concurrency:
  group: import-music-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import-events:
    name: Import Music Events
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run import script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import:uiw

      - name: Commit and push downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/
          if ! git diff --staged --quiet; then
            git commit -m "chore(events): import new music event photos from UIT in Wageningen"
            git push origin main
          else
            echo "No new images to commit."
          fi
